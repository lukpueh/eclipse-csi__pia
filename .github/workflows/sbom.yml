name: Generate SBOM

on:
  registry_package:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag (e.g. 0.2.1)"
        required: true

permissions:
  id-token: write

env:
  REGISTRY: ghcr.io
  OWNER: eclipse-csi
  NAME: pia
  VERSION: "${{ inputs.version || github.event.registry_package.package_version.container_metadata.tag.name }}"
  PIA_DOMAIN: pia-staging.eclipse.org

jobs:
  sbom-docker:
    runs-on: ubuntu-latest
    steps:
    # TODO: See what's in it, most notably
    # - github.event.registry_package.package_version.container_metadata.tag.name
    # - registry_package.package_version.tag_name
    # If there are multiple tags in the event, we need to pick one
    # If there are redundant events for multiple tags, we need to filter events
    - name: Debug registry_package event
      if: github.event_name == 'registry_package'
      run: echo '${{ toJSON(github.event.registry_package) }}' | jq .

    - name: Generate SBOM
      uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
      with:
        image: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.NAME }}:${{ env.VERSION }}
        output-file: sbom.json
        format: cyclonedx-json
        upload-artifact: false

    - name: Upload SBOM 1
      uses: lukpueh/eclipse-csi__workflows/upload-sbom@d6afe9284b1608ab51fc7fca886fbf820341a1a6
      with:
        sbom-file: sbom.json
        product-name: ${{ env.NAME }}
        product-version: ${{ env.VERSION }}

    - name: Upload SBOM 2
      uses: lukpueh/eclipse-csi__workflows/upload-sbom@d6afe9284b1608ab51fc7fca886fbf820341a1a6
      with:
        sbom-file: sbom.json
        product-name: ${{ env.NAME }}-2
        product-version: ${{ env.VERSION }}
