services:
  pia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pia
    ports:
      - "8000:8000"
    environment:
      - PIA_DEPENDENCY_TRACK_API_KEY=${PIA_DEPENDENCY_TRACK_API_KEY:-test-api-key}
      - PIA_DATABASE_URL=postgresql://pia:pia@postgres:5432/pia
      - PIA_EXPECTED_AUDIENCE=${PIA_EXPECTED_AUDIENCE:-pia.eclipse.org}
      - PIA_DEPENDENCY_TRACK_URL=${PIA_DEPENDENCY_TRACK_URL:-https://sbom.eclipse.org/api/v1/bom}
    volumes:
      - ./pia:/app/pia:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn pia.main:app --host 0.0.0.0 --port 8000 --reload"]

  postgres:
    image: postgres:17-alpine
    container_name: pia-postgres
    environment:
      POSTGRES_USER: pia
      POSTGRES_PASSWORD: pia
      POSTGRES_DB: pia
    volumes:
      - pia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pia -d pia"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pia-postgres-data:
