# Example curated file for trying `pia sync` against the local docker-compose
# stack (see README "Trying the sync CLI locally"). Run the sync with
# --create-dt-projects to have the referenced DependencyTrack projects created if
# they don't exist yet.
projects:
  - id: eclipse.csi
    workloads:
      - https://github.com/eclipse-csi/pia
    dependency_track:
      - parent: "Eclipse CSI"
        project: pia
